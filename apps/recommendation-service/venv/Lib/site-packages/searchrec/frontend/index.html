<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SearchRec</title>
  <script src="config.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header>
  <div class="logo">SearchRec</div>
  <div class="search-wrap">
    <svg class="icon-search" width="16" height="16" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input type="text" id="search-input" placeholder="Search products…" autocomplete="off" />
  </div>
</header>

<main>
  <p class="section-title" id="results-label">All products</p>
  <div class="grid" id="results-grid"></div>
</main>

<!-- Item detail + recommendations modal -->
<div class="overlay" id="overlay">
  <div class="modal" role="dialog" aria-modal="true">
    <button class="modal-close" id="modal-close" aria-label="Close">&#x2715;</button>

    <div class="modal-detail" id="modal-detail">
      <!-- filled by JS -->
    </div>

    <div class="modal-recs" id="modal-recs">
      <h3>You may also like</h3>
      <div class="rec-grid" id="rec-grid"></div>
    </div>
  </div>
</div>

<script src="tracker.js"></script>
<script>
const BASE = window.REC_BASE || "";

// ── Category emoji map ────────────────────────────────────────────────────────
const CAT_EMOJI = {
  "Laptops":       "💻",
  "Phones":        "📱",
  "Audio":         "🎧",
  "Tablets":       "🖥️",
  "Cameras":       "📷",
  "Running Shoes": "👟",
  "Casual Shoes":  "👠",
  "Clothing":      "👕",
  "Kitchen":       "🍳",
  "Fitness":       "🏋️",
};

function emoji(category) {
  return CAT_EMOJI[category] || "📦";
}

function formatPrice(price) {
  return "$" + Number(price).toFixed(2);
}

// ── Render helpers ────────────────────────────────────────────────────────────
function createCard(item, position, query) {
  const card = document.createElement("div");
  card.className = "card";

  card.innerHTML = `
    <div class="card-img" data-cat="${item.category}">${emoji(item.category)}</div>
    <div class="card-body">
      <div class="card-name">${item.name}</div>
      <div class="card-meta">
        <span class="card-price">${formatPrice(item.price)}</span>
        <span class="badge">${item.category}</span>
      </div>
    </div>
  `;

  card.addEventListener("click", () => {
    Tracker.track(item.item_id, query, position);
    openModal(item);
  });

  return card;
}

function createRecCard(rec) {
  const card = document.createElement("div");
  card.className = "rec-card";

  card.innerHTML = `
    <div class="rec-img" data-cat="${rec.category}">${emoji(rec.category)}</div>
    <div class="rec-body">
      <div class="rec-name">${rec.name}</div>
      <div class="rec-price">${formatPrice(rec.price)}</div>
    </div>
  `;

  card.addEventListener("click", () => {
    Tracker.track(rec.item_id, "", 0);
    openModal(rec);
  });

  return card;
}

// ── Modal ─────────────────────────────────────────────────────────────────────
const overlay  = document.getElementById("overlay");
const modalDetail = document.getElementById("modal-detail");
const recGrid  = document.getElementById("rec-grid");

function openModal(item) {
  const inStock = item.in_stock !== false && item.in_stock !== 0;

  modalDetail.innerHTML = `
    <div class="modal-img" data-cat="${item.category}">${emoji(item.category)}</div>
    <div class="modal-info">
      <div class="modal-category">${item.category}</div>
      <div class="modal-name">${item.name}</div>
      <div class="modal-price">${formatPrice(item.price)}</div>
      <span class="stock-pill ${inStock ? "in" : "out"}">
        ${inStock ? "In stock" : "Out of stock"}
      </span>
    </div>
  `;

  recGrid.innerHTML = "";
  overlay.classList.add("open");
  document.body.style.overflow = "hidden";

  loadRecs(item.item_id);
}

function closeModal() {
  overlay.classList.remove("open");
  document.body.style.overflow = "";
}

async function loadRecs(itemId) {
  recGrid.innerHTML = `<p class="recs-empty">Loading…</p>`;
  try {
    const res = await fetch(BASE + `/api/recommend/${itemId}?limit=8`);
    if (res.status === 404) {
      recGrid.innerHTML = `<p class="recs-empty">No recommendations yet — more clicks needed.</p>`;
      return;
    }
    const data = await res.json();
    recGrid.innerHTML = "";
    if (!data.recommendations || data.recommendations.length === 0) {
      recGrid.innerHTML = `<p class="recs-empty">No recommendations yet.</p>`;
      return;
    }
    data.recommendations.forEach(rec => {
      recGrid.appendChild(createRecCard(rec));
    });
  } catch (e) {
    recGrid.innerHTML = `<p class="recs-empty">Could not load recommendations.</p>`;
  }
}

document.getElementById("modal-close").addEventListener("click", closeModal);
overlay.addEventListener("click", e => { if (e.target === overlay) closeModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

// ── Search & results ──────────────────────────────────────────────────────────
const grid   = document.getElementById("results-grid");
const label  = document.getElementById("results-label");
const input  = document.getElementById("search-input");

let debounceTimer = null;

async function fetchItems(q = "") {
  const url = q.trim()
    ? BASE + `/api/items/search?q=${encodeURIComponent(q)}&limit=80`
    : BASE + `/api/items/search?limit=80`;
  const res = await fetch(url);
  return res.json();
}

async function renderItems(q = "") {
  grid.innerHTML = `<p class="empty">Loading…</p>`;

  try {
    const data = await fetchItems(q);
    const items = data.items || [];

    label.textContent = q.trim()
      ? `${items.length} result${items.length !== 1 ? "s" : ""} for "${q}"`
      : "All products";

    grid.innerHTML = "";
    if (items.length === 0) {
      grid.innerHTML = `<p class="empty">No products found.</p>`;
      return;
    }
    items.forEach((item, i) => grid.appendChild(createCard(item, i, q)));
  } catch (e) {
    grid.innerHTML = `<p class="empty">Could not load products. Is the server running?</p>`;
  }
}

input.addEventListener("input", () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => renderItems(input.value), 220);
});

// Initial load
renderItems();
</script>
</body>
</html>
