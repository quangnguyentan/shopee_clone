<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SearchRec — Admin</title>
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #f1f5f9;
      --surface:  #ffffff;
      --border:   #e2e8f0;
      --text:     #0f172a;
      --muted:    #64748b;
      --accent:   #2563eb;
      --accent-h: #1d4ed8;
      --danger:   #dc2626;
      --success:  #16a34a;
      --radius:   12px;
      --shadow:   0 1px 4px rgba(0,0,0,0.08);
    }

    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
           background: var(--bg); color: var(--text); min-height: 100vh; }

    /* ── Header ─────────────────────────────────────────── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 28px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky; top: 0; z-index: 50;
    }
    .header-left { display: flex; align-items: center; gap: 20px; }
    .logo { font-weight: 700; font-size: 1rem; letter-spacing: -0.3px; }
    .logo span { color: var(--muted); font-weight: 400; }
    header a { font-size: 0.85rem; color: var(--muted); text-decoration: none; }
    header a:hover { color: var(--text); }

    .btn {
      padding: 6px 16px; border-radius: 8px; font-size: 0.85rem;
      font-weight: 500; border: none; cursor: pointer; transition: background 0.15s;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-h); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-outline { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
    .btn-outline:hover { background: var(--accent); color: #fff; }
    .header-right { display: flex; align-items: center; gap: 10px; }

    /* ── Layout ──────────────────────────────────────────── */
    main { max-width: 1280px; margin: 0 auto; padding: 28px 28px 48px; display: flex; flex-direction: column; gap: 24px; }

    /* ── Stat cards ──────────────────────────────────────── */
    .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    .stat-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px 22px; box-shadow: var(--shadow);
    }
    .stat-label { font-size: 0.72rem; font-weight: 600; text-transform: uppercase;
                  letter-spacing: 0.06em; color: var(--muted); margin-bottom: 8px; }
    .stat-value { font-size: 2rem; font-weight: 700; line-height: 1; }
    .stat-sub   { font-size: 0.8rem; color: var(--muted); margin-top: 5px; }

    /* ── Panel (card with title) ─────────────────────────── */
    .panel {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 22px 24px; box-shadow: var(--shadow);
    }
    .panel-title {
      font-size: 0.78rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.06em; color: var(--muted); margin-bottom: 18px;
    }

    /* ── Two-column row ──────────────────────────────────── */
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }

    /* ── Heatmap ─────────────────────────────────────────── */
    .heatmap-wrap { overflow: auto; }
    #heatmap-canvas { display: block; }

    /* ── Tooltip ─────────────────────────────────────────── */
    #tooltip {
      position: fixed; display: none; pointer-events: none;
      background: #0f172a; color: #fff;
      font-size: 0.78rem; padding: 5px 10px;
      border-radius: 6px; white-space: nowrap; z-index: 999;
    }

    /* ── Item inspector ──────────────────────────────────── */
    .inspector-search { position: relative; margin-bottom: 20px; }
    .inspector-search input {
      width: 100%; max-width: 400px; height: 38px;
      border: 1px solid var(--border); border-radius: 8px;
      padding: 0 14px; font-size: 0.9rem; outline: none;
      transition: border-color 0.15s;
    }
    .inspector-search input:focus { border-color: var(--accent); }
    .autocomplete {
      position: absolute; top: 100%; left: 0; width: 400px; max-height: 260px;
      overflow-y: auto; background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.12);
      z-index: 100; display: none;
    }
    .autocomplete.open { display: block; }
    .ac-item {
      padding: 9px 14px; font-size: 0.87rem; cursor: pointer;
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
    }
    .ac-item:hover { background: var(--bg); }
    .ac-cat { font-size: 0.75rem; color: var(--muted); }

    .inspector-result { display: none; }
    .inspector-result.open { display: block; }
    .selected-item {
      display: flex; align-items: center; gap: 16px;
      padding: 16px; background: var(--bg); border-radius: 10px; margin-bottom: 20px;
    }
    .selected-emoji { font-size: 2.4rem; }
    .selected-name  { font-weight: 600; font-size: 1rem; }
    .selected-meta  { font-size: 0.82rem; color: var(--muted); margin-top: 3px; }

    .rec-table { width: 100%; border-collapse: collapse; font-size: 0.87rem; }
    .rec-table th {
      text-align: left; padding: 8px 12px; font-size: 0.72rem; text-transform: uppercase;
      letter-spacing: 0.05em; color: var(--muted); border-bottom: 2px solid var(--border);
    }
    .rec-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); }
    .rec-table tr:last-child td { border-bottom: none; }

    .score-bar-wrap { display: flex; align-items: center; gap: 10px; }
    .score-bar { height: 6px; border-radius: 3px; background: var(--accent); min-width: 4px; }
    .score-num { font-size: 0.8rem; color: var(--muted); white-space: nowrap; }

    .empty-state { color: var(--muted); font-size: 0.88rem; padding: 20px 0; }

    /* ── Retrain toast ───────────────────────────────────── */
    #toast {
      position: fixed; bottom: 24px; right: 24px;
      background: #0f172a; color: #fff; font-size: 0.85rem;
      padding: 10px 18px; border-radius: 8px; opacity: 0;
      transition: opacity 0.3s; pointer-events: none; z-index: 999;
    }
    #toast.show { opacity: 1; }

    @media (max-width: 900px) {
      .stats-row { grid-template-columns: repeat(2, 1fr); }
      .two-col   { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="logo">SearchRec <span>/ Admin</span></div>
    <a href="#" id="store-link">← Store</a>
  </div>
  <div class="header-right">
    <button class="btn btn-outline" id="export-csv-btn">Download CSV</button>
    <button class="btn btn-outline" id="export-btn">Download JSON</button>
    <button class="btn btn-primary" id="retrain-btn">Retrain Model</button>
  </div>
</header>

<main>

  <!-- Stats cards -->
  <div class="stats-row" id="stats-row">
    <div class="stat-card"><div class="stat-label">Total Clicks</div><div class="stat-value" id="s-clicks">—</div><div class="stat-sub" id="s-sessions">— sessions</div></div>
    <div class="stat-card"><div class="stat-label">Coverage</div><div class="stat-value" id="s-coverage">—</div><div class="stat-sub" id="s-coverage-sub">— / — items have recs</div></div>
    <div class="stat-card"><div class="stat-label">Avg Similarity</div><div class="stat-value" id="s-score">—</div><div class="stat-sub" id="s-pairs">— pairs cached</div></div>
    <div class="stat-card"><div class="stat-label">Last Retrain</div><div class="stat-value" id="s-retrain" style="font-size:1.1rem;line-height:1.5">—</div><div class="stat-sub" id="s-retrain-sub"></div></div>
  </div>

  <!-- Click volume line chart -->
  <div class="panel">
    <div class="panel-title">Click volume — last 14 days</div>
    <canvas id="timeseries-chart" height="80"></canvas>
  </div>

  <!-- Heatmap + top items -->
  <div class="two-col">
    <div class="panel">
      <div class="panel-title">Co-click matrix — top 20 items</div>
      <div class="heatmap-wrap">
        <canvas id="heatmap-canvas"></canvas>
      </div>
    </div>
    <div class="panel">
      <div class="panel-title">Top items by clicks</div>
      <canvas id="top-chart"></canvas>
    </div>
  </div>

  <!-- Item inspector -->
  <div class="panel">
    <div class="panel-title">Item inspector</div>
    <div class="inspector-search">
      <input type="text" id="inspector-input" placeholder="Search for a product…" autocomplete="off" />
      <div class="autocomplete" id="autocomplete"></div>
    </div>
    <div class="inspector-result" id="inspector-result">
      <div class="selected-item" id="selected-item"></div>
      <div id="inspector-recs"></div>
    </div>
  </div>

</main>

<div id="tooltip"></div>
<div id="toast"></div>

<script>
const BASE = window.REC_BASE || "";

document.getElementById("store-link").href = BASE + "/";

// ── Utilities ─────────────────────────────────────────────────────────────────

const CAT_EMOJI = {
  "Laptops":"💻","Phones":"📱","Audio":"🎧","Tablets":"🖥️",
  "Cameras":"📷","Running Shoes":"👟","Casual Shoes":"👠",
  "Clothing":"👕","Kitchen":"🍳","Fitness":"🏋️",
};
function emoji(cat) { return CAT_EMOJI[cat] || "📦"; }
function fmt(n)     { return Number(n).toLocaleString(); }
function fmtScore(s){ return Number(s).toFixed(3); }

function timeAgo(ms) {
  if (!ms) return "Never";
  const diff = Date.now() - ms;
  const m = Math.floor(diff / 60000);
  if (m < 1)   return "Just now";
  if (m < 60)  return m + "m ago";
  const h = Math.floor(m / 60);
  if (h < 24)  return h + "h ago";
  return Math.floor(h / 24) + "d ago";
}

function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 3000);
}

// ── Stats ─────────────────────────────────────────────────────────────────────

async function loadStats() {
  const data = await fetch(BASE + "/api/admin/stats").then(r => r.json());
  document.getElementById("s-clicks").textContent    = fmt(data.total_clicks);
  document.getElementById("s-sessions").textContent  = fmt(data.total_sessions) + " sessions";
  document.getElementById("s-coverage").textContent  = (data.coverage * 100).toFixed(0) + "%";
  document.getElementById("s-coverage-sub").textContent =
    fmt(data.items_with_recs) + " / " + fmt(data.total_items) + " items have recs";
  document.getElementById("s-score").textContent     = fmtScore(data.avg_score);
  document.getElementById("s-pairs").textContent     = fmt(data.total_pairs) + " pairs cached";
  document.getElementById("s-retrain").textContent   = timeAgo(data.last_retrain_ts);
  document.getElementById("s-retrain-sub").textContent =
    data.last_retrain_ts ? new Date(data.last_retrain_ts).toLocaleString() : "";
}

// ── Timeseries chart ──────────────────────────────────────────────────────────

let timeseriesChart = null;

async function loadTimeseries() {
  const data  = await fetch(BASE + "/api/admin/clicks/timeseries?days=14").then(r => r.json());
  const ctx   = document.getElementById("timeseries-chart").getContext("2d");
  const labels = data.days.map(d => {
    const [, m, day] = d.split("-");
    return `${parseInt(m)}/${parseInt(day)}`;
  });

  if (timeseriesChart) timeseriesChart.destroy();
  timeseriesChart = new Chart(ctx, {
    type: "line",
    data: {
      labels,
      datasets: [{
        data: data.counts,
        borderColor:     "#2563eb",
        backgroundColor: "rgba(37,99,235,0.08)",
        borderWidth: 2,
        pointRadius: 3,
        pointHoverRadius: 5,
        fill: true,
        tension: 0.3,
      }],
    },
    options: {
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { display: false } },
        y: { beginAtZero: true, ticks: { precision: 0 } },
      },
    },
  });
}

// ── Top items bar chart ───────────────────────────────────────────────────────

let topChart = null;

async function loadTopItems() {
  const data  = await fetch(BASE + "/api/admin/clicks/top?limit=20").then(r => r.json());
  const items = data.items;
  const ctx   = document.getElementById("top-chart").getContext("2d");
  const labels = items.map(i => (i.name || i.item_id).slice(0, 26));
  const counts = items.map(i => i.clicks);

  if (topChart) topChart.destroy();
  topChart = new Chart(ctx, {
    type: "bar",
    data: {
      labels,
      datasets: [{
        data: counts,
        backgroundColor: "rgba(37,99,235,0.75)",
        borderRadius: 4,
        borderSkipped: false,
      }],
    },
    options: {
      indexAxis: "y",
      plugins: { legend: { display: false } },
      scales: {
        x: { beginAtZero: true, ticks: { precision: 0 } },
        y: { ticks: { font: { size: 11 } } },
      },
    },
  });
}

// ── Co-click heatmap (canvas) ─────────────────────────────────────────────────

const CELL     = 32;
const LABEL_W  = 150;
const LABEL_H  = 130;

let heatData = null;

function lerp(a, b, t) { return Math.round(a + (b - a) * t); }

function cellColor(val, maxVal) {
  if (val === 0) return "#f8fafc";
  const t = Math.sqrt(val / maxVal);           // sqrt scale — dim values still visible
  return `rgb(${lerp(219,30,t)},${lerp(234,64,t)},${lerp(254,175,t)})`;
}

async function loadHeatmap() {
  const data = await fetch(BASE + "/api/admin/matrix?limit=20").then(r => r.json());
  heatData = data;

  const canvas = document.getElementById("heatmap-canvas");
  const { items, labels, matrix } = data;
  const n = items.length;
  if (n === 0) return;

  const LEGEND_H = 40;
  const W = LABEL_W + n * CELL + 8;
  const H = LABEL_H + n * CELL + LEGEND_H;
  canvas.width  = W;
  canvas.height = H;
  const ctx = canvas.getContext("2d");

  const flat   = matrix.flat();
  const maxVal = Math.max(...flat);

  ctx.clearRect(0, 0, W, H);

  // Cells
  for (let i = 0; i < n; i++) {
    for (let j = 0; j < n; j++) {
      const x   = LABEL_W + j * CELL;
      const y   = LABEL_H + i * CELL;
      const val = matrix[i][j];
      ctx.fillStyle = (i === j) ? "#f1f5f9" : cellColor(val, maxVal);
      ctx.fillRect(x, y, CELL - 1, CELL - 1);

      if (val > 0 && i !== j) {
        const brightness = val / maxVal;
        ctx.fillStyle  = brightness > 0.55 ? "#fff" : "#1e40af";
        ctx.font       = "9px system-ui";
        ctx.textAlign  = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(val, x + CELL / 2 - 0.5, y + CELL / 2 - 0.5);
      }
    }
  }

  // Row labels
  ctx.fillStyle    = "#374151";
  ctx.font         = "11px system-ui";
  ctx.textAlign    = "right";
  ctx.textBaseline = "middle";
  for (let i = 0; i < n; i++) {
    const lbl = labels[i].length > 22 ? labels[i].slice(0, 21) + "…" : labels[i];
    ctx.fillText(lbl, LABEL_W - 6, LABEL_H + i * CELL + CELL / 2 - 0.5);
  }

  // Column labels (rotated 45°)
  ctx.fillStyle    = "#374151";
  ctx.font         = "11px system-ui";
  ctx.textAlign    = "left";
  ctx.textBaseline = "middle";
  for (let j = 0; j < n; j++) {
    const lbl = labels[j].length > 22 ? labels[j].slice(0, 21) + "…" : labels[j];
    const x   = LABEL_W + j * CELL + CELL / 2;
    ctx.save();
    ctx.translate(x, LABEL_H - 6);
    ctx.rotate(-Math.PI / 4);
    ctx.fillText(lbl, 0, 0);
    ctx.restore();
  }

  // Color scale legend
  const legendY = LABEL_H + n * CELL + 12;
  const legendW = Math.min(n * CELL, 200);
  const grad = ctx.createLinearGradient(LABEL_W, 0, LABEL_W + legendW, 0);
  grad.addColorStop(0,   "#f8fafc");
  grad.addColorStop(1,   "rgb(30,64,175)");
  ctx.fillStyle = grad;
  ctx.fillRect(LABEL_W, legendY, legendW, 10);
  ctx.strokeStyle = "#e2e8f0";
  ctx.lineWidth   = 1;
  ctx.strokeRect(LABEL_W, legendY, legendW, 10);

  ctx.fillStyle    = "#64748b";
  ctx.font         = "10px system-ui";
  ctx.textBaseline = "top";
  ctx.textAlign    = "left";
  ctx.fillText("0", LABEL_W, legendY + 14);
  ctx.textAlign = "right";
  ctx.fillText(maxVal + " co-clicks", LABEL_W + legendW, legendY + 14);
}

// Tooltip for heatmap
const tooltip = document.getElementById("tooltip");

document.getElementById("heatmap-canvas").addEventListener("mousemove", (e) => {
  if (!heatData) return;
  const { labels, matrix } = heatData;
  const n   = labels.length;
  const rect = e.currentTarget.getBoundingClientRect();
  const scaleX = e.currentTarget.width  / rect.width;
  const scaleY = e.currentTarget.height / rect.height;
  const cx = (e.clientX - rect.left) * scaleX;
  const cy = (e.clientY - rect.top)  * scaleY;
  const j  = Math.floor((cx - LABEL_W) / CELL);
  const i  = Math.floor((cy - LABEL_H) / CELL);

  if (i >= 0 && i < n && j >= 0 && j < n && i !== j) {
    const val = matrix[i][j];
    tooltip.textContent    = `${labels[i]} × ${labels[j]}: ${val} co-click${val !== 1 ? "s" : ""}`;
    tooltip.style.display  = "block";
    tooltip.style.left     = (e.clientX + 14) + "px";
    tooltip.style.top      = (e.clientY - 32) + "px";
  } else {
    tooltip.style.display = "none";
  }
});

document.getElementById("heatmap-canvas").addEventListener("mouseleave", () => {
  tooltip.style.display = "none";
});

// ── Item inspector ────────────────────────────────────────────────────────────

const inspectorInput  = document.getElementById("inspector-input");
const autocompleteEl  = document.getElementById("autocomplete");
const inspectorResult = document.getElementById("inspector-result");
const selectedItemEl  = document.getElementById("selected-item");
const inspectorRecs   = document.getElementById("inspector-recs");

let acTimer = null;

inspectorInput.addEventListener("input", () => {
  clearTimeout(acTimer);
  acTimer = setTimeout(() => fetchSuggestions(inspectorInput.value), 200);
});

inspectorInput.addEventListener("blur", () => {
  setTimeout(() => autocompleteEl.classList.remove("open"), 150);
});

async function fetchSuggestions(q) {
  if (!q.trim()) { autocompleteEl.classList.remove("open"); return; }
  const data  = await fetch(BASE + `/api/items/search?q=${encodeURIComponent(q)}&limit=8`).then(r => r.json());
  const items = data.items || [];
  autocompleteEl.innerHTML = "";
  if (items.length === 0) { autocompleteEl.classList.remove("open"); return; }
  items.forEach(item => {
    const div = document.createElement("div");
    div.className = "ac-item";
    div.innerHTML = `<span>${emoji(item.category)} ${item.name}</span><span class="ac-cat">${item.category}</span>`;
    div.addEventListener("mousedown", () => selectItem(item));
    autocompleteEl.appendChild(div);
  });
  autocompleteEl.classList.add("open");
}

async function selectItem(item) {
  inspectorInput.value = item.name;
  autocompleteEl.classList.remove("open");
  inspectorResult.classList.add("open");

  selectedItemEl.innerHTML = `
    <div class="selected-emoji">${emoji(item.category)}</div>
    <div>
      <div class="selected-name">${item.name}</div>
      <div class="selected-meta">${item.category} · $${Number(item.price).toFixed(2)} · ${item.in_stock ? "In stock" : "Out of stock"}</div>
    </div>
  `;

  inspectorRecs.innerHTML = `<p class="empty-state">Loading recommendations…</p>`;

  try {
    const res = await fetch(BASE + `/api/recommend/${item.item_id}?limit=10`);
    if (res.status === 404) {
      inspectorRecs.innerHTML = `<p class="empty-state">No recommendations found — run a retrain first.</p>`;
      return;
    }
    const data = await res.json();
    const recs = data.recommendations || [];
    if (recs.length === 0) {
      inspectorRecs.innerHTML = `<p class="empty-state">No recommendations found.</p>`;
      return;
    }
    const maxScore = recs[0].score;
    inspectorRecs.innerHTML = `
      <table class="rec-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Item</th>
            <th>Category</th>
            <th>Price</th>
            <th>Score</th>
          </tr>
        </thead>
        <tbody>
          ${recs.map((r, i) => `
            <tr>
              <td style="color:var(--muted)">${i + 1}</td>
              <td>${emoji(r.category)} ${r.name}</td>
              <td style="color:var(--muted)">${r.category}</td>
              <td>$${Number(r.price).toFixed(2)}</td>
              <td>
                <div class="score-bar-wrap">
                  <div class="score-bar" style="width:${Math.round((r.score / maxScore) * 120)}px"></div>
                  <span class="score-num">${fmtScore(r.score)}</span>
                </div>
              </td>
            </tr>`).join("")}
        </tbody>
      </table>
    `;
  } catch {
    inspectorRecs.innerHTML = `<p class="empty-state">Failed to load recommendations.</p>`;
  }
}

// ── Export buttons ────────────────────────────────────────────────────────────

async function triggerDownload(endpoint, filename, btnId, idleLabel) {
  const btn = document.getElementById(btnId);
  btn.disabled    = true;
  btn.textContent = "Exporting…";
  try {
    const res  = await fetch(BASE + endpoint);
    const blob = await res.blob();
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement("a");
    a.href     = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
  } catch {
    toast("Export failed — check server logs");
  } finally {
    btn.disabled    = false;
    btn.textContent = idleLabel;
  }
}

document.getElementById("export-btn").addEventListener("click", () =>
  triggerDownload("/api/admin/export",     "recommendations.json", "export-btn",     "Download JSON")
);

document.getElementById("export-csv-btn").addEventListener("click", () =>
  triggerDownload("/api/admin/export/csv", "recommendations.csv",  "export-csv-btn", "Download CSV")
);

// ── Retrain button ────────────────────────────────────────────────────────────

document.getElementById("retrain-btn").addEventListener("click", async () => {
  const btn = document.getElementById("retrain-btn");
  btn.disabled    = true;
  btn.textContent = "Retraining…";
  try {
    const res  = await fetch(BASE + "/api/retrain", { method: "POST" });
    const data = await res.json();
    toast(`Retrain complete — ${fmt(data.pairs || 0)} pairs across ${fmt(data.items || 0)} items`);
    await Promise.all([loadStats(), loadTimeseries(), loadTopItems(), loadHeatmap()]);
  } catch {
    toast("Retrain failed — check server logs");
  } finally {
    btn.disabled    = false;
    btn.textContent = "Retrain Model";
  }
});

// ── Bootstrap ─────────────────────────────────────────────────────────────────

Promise.all([loadStats(), loadTimeseries(), loadTopItems(), loadHeatmap()]);
</script>
</body>
</html>
