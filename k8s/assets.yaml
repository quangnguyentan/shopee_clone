apiVersion: v1
kind: ConfigMap
metadata:
  name: assets-config
  namespace: ${K8S_NAMESPACE}
data:
  NODE_ENV: production
  PORT: "8082"
  BUYER_ENV: ${BUYER_URL}
  ADMIN_ENV: ${ADMIN_URL}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: assets
  namespace: ${K8S_NAMESPACE}
spec:
  replicas: 2
  selector:
    matchLabels:
      app: assets
  template:
    metadata:
      labels:
        app: assets
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: assets
          image: ${ECR_REGISTRY}/${ECR_REPOSITORY_PREFIX}-assets:${IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082
          envFrom:
            - configMapRef:
                name: assets-config
            - secretRef:
                name: assets-secrets
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: assets
  namespace: ${K8S_NAMESPACE}
spec:
  type: LoadBalancer
  selector:
    app: assets
  ports:
    - name: http
      port: 8082
      targetPort: http
