apiVersion: v1
kind: ConfigMap
metadata:
  name: recommendation-config
  namespace: ${K8S_NAMESPACE}
data:
  RECOMMENDATION_CACHE_TTL_SECONDS: "300"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendation-service
  namespace: ${K8S_NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recommendation-service
  template:
    metadata:
      labels:
        app: recommendation-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: recommendation-service
          image: ${ECR_REGISTRY}/${ECR_REPOSITORY_PREFIX}-recommendation-service:${IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: recommendation-config
            - secretRef:
                name: recommendation-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: recommendation-service
  namespace: ${K8S_NAMESPACE}
spec:
  type: ClusterIP
  selector:
    app: recommendation-service
  ports:
    - name: http
      port: 8000
      targetPort: http
